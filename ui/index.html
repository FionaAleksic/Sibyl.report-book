<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sibyl · Berichtsheft</title><link rel="stylesheet" href="report.css"><script defer src="bridge.js"></script><script defer src="report.js"></script></head><body>
<header><h1>Ausbildungsberichtsheft</h1><p>Wochenberichte · dauerhaft gespeichert</p></header>
<div class="grid"><aside class="panel"><h2>Wochenübersicht</h2><button class="primary" id="new-week">+ Neue Woche</button><div id="weeks"></div><p class="hint">Berichte sind aktuell deinem Benutzerkonto zugeordnet. Eine Ausbilderfreigabe erfordert zusätzliche Rollen.</p></aside>
<main class="panel"><div class="row"><label>Woche beginnt (Montag)<input type="date" id="monday"></label><label>Status<select id="state"><option value="DRAFT">Entwurf</option><option value="SUBMITTED">Zur Prüfung vorgemerkt</option></select></label></div>
<h2>Tätigkeiten</h2><div class="row"><label>Tag<input type="date" id="day"></label><label>Minuten<input type="number" id="minutes" min="15" max="720" step="15" value="90"></label></div>
<label>Bereich<input id="category" maxlength="100" value="Systemintegration"></label>
<label>Beschreibung<textarea id="description" maxlength="4000" rows="4">Server konfigurieren und dokumentieren</textarea></label>
<button id="add-entry">+ Tätigkeit hinzufügen</button><div class="table"><table><thead><tr><th>Datum</th><th>Min.</th><th>Bereich</th><th>Tätigkeit</th><th></th></tr></thead><tbody id="entries"></tbody></table></div>
<p id="total">Gesamt: 0 Minuten</p><div class="buttons"><button class="primary" id="save">Woche speichern</button><button id="export">Markdown exportieren</button><button id="calculate">Im Java-Worker prüfen</button><button id="archive">Archivieren</button></div>
<p id="status" role="status" aria-live="polite"></p><label>Markdown-Ausgabe<textarea id="markdown" rows="8" readonly></textarea></label></main></div></body></html>
